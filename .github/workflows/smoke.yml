name: Smoke Check

on:
  push:
    branches:
      - main          # <-- change if your default branch isn't 'main'
  workflow_dispatch:  # allows manual runs from the Actions tab

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Show context
        run: |
          echo "Actor: ${GITHUB_ACTOR}"
          echo "Ref:   ${GITHUB_REF}"
          echo "SHA:   ${GITHUB_SHA}"
