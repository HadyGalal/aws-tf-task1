name: Smoke Check

on:
  push:
    branches: [ main ]   # change to your default branch if not 'main'
  workflow_dispatch:      # lets you trigger from the Actions tab

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Show context
        run: |
          echo "Actor: $GITHUB_ACTOR"
          echo "Ref:   $GITHUB_REF"
          echo "SHA:   $GITHUB_SHA"
