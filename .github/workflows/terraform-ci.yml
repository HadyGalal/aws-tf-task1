name: Terraform CI (PR)

on:
  #pull_request:
  #  branches: [ main ]
  #  paths:
  #    - '**/*.tf'
  #    - 'modules/**'
  #    - '.github/workflows/terraform-*.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type EXACTLY: DESTROY'
        required: true
        default: 'NO'
      workspace:
        description: 'Terraform workspace to destroy (default/dev/etc)'
        required: false
        default: 'default'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_WORKING_DIR: .
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
  AWS_REGION: eu-central-1
  TERRAFORM_VERSION: 1.6.6

jobs:
  plan:
    runs-on: ubuntu-latest
    concurrency:
      group: tf-plan-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Dump GitHub OIDC token claims
        run: |
          echo "REF=$GITHUB_REF"
          echo "HEAD_REF=$GITHUB_HEAD_REF"
          echo "BASE_REF=$GITHUB_BASE_REF"
          echo "REPO=$GITHUB_REPOSITORY"
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::362976989898:role/aws-tf-infra
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Create plugin cache directory
        run: |
          mkdir -p ~/.terraform.d/plugin-cache

      - name: terraform fmt (check)
        run: terraform fmt -check -diff

      - name: terraform init
        run: terraform init -upgrade

      - name: terraform validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --format=compact

      - name: terraform plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > tfplan.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: |
            tfplan
            tfplan.txt
          retention-days: 7

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('tfplan.txt', 'utf8');
            const body = [
              '### Terraform Plan',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```diff',
              plan.substring(0, 65000),
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
