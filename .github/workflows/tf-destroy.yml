name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DESTROY" to confirm'
        required: true
        default: "NO"

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    concurrency:
      group: tf-destroy
      cancel-in-progress: false

    steps:
      - name: Confirm
        if: ${{ github.event.inputs.confirm != 'DESTROY' }}
        run: |
          echo "You must type DESTROY to run this workflow."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate via OIDC → short-lived AWS creds for Terraform
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::362976989898:role/tf-1-role
          aws-region: eu-central-1

      - name: Show AWS identity (debug)
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (same backend as apply)
        run: terraform init -reconfigure

      # If you use workspaces, uncomment and set the right one:
      # - name: Select workspace
      #   run: terraform workspace select prod

      # Optional: log current state before destroy
      - name: List state
        run: terraform state list || true

      # Optional pre-clean: empty bucket to avoid delete errors if not using force_destroy
      # Replace BUCKET_NAME or read it from outputs/data sources
      - name: Empty S3 bucket (if needed)
        run: |
          set -e
          BUCKET=$(terraform output -raw bucket_name || echo "")
          if [ -n "$BUCKET" ]; then
            echo "Emptying s3://$BUCKET ..."
            aws s3 rm "s3://$BUCKET" --recursive || true
          else
            echo "No bucket_name output; skipping empty step."
          fi

      - name: Plan destroy
        run: terraform plan -destroy -out=tfplan

      - name: Destroy
        run: terraform destroy -auto-approve
