name: AWS Deploy (Terraform + CloudFront OAC)

on:
  push:
    branches:
      - main
    paths:
      - 'task-1.html'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: tf-apply-main
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::362976989898:role/tf-1-role
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # Invalidate JUST the updated file (faster/cheaper than /*)
      - name: Invalidate CloudFront for task-1.html
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id || true)
          if [ -n "$DIST_ID" ]; then
            # Adjust the path below if file is under a folder, e.g., "/site/task-1.html"
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/task-1.html"
          fi
